name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore pdf-forge.sln

      - name: Build
        run: dotnet build pdf-forge.sln -c Release --no-restore

      - name: Test
        run: dotnet test pdf-forge.sln -c Release --no-build --verbosity normal
